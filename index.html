    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 50%, #ffe4e6 100%);
            min-height: 100vh;
        }
        .font-open-sans {
            font-family: 'Open Sans', sans-serif;
        }
        .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        
        /* Floating background dot stars animation */
        @keyframes floatUpStar {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0.15;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(180deg);
                opacity: 0;
            }
        }
        .bg-star {
            position: absolute;
            color: #f472b6;
            user-select: none;
            pointer-events: none;
            animation: floatUpStar 14s linear infinite;
        }
        
        /* Message Card Pop-in Animation */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Dodging button smooth shift */
        #no-btn {
            transition: transform 0.15s ease-out, top 0.2s ease, left 0.2s ease;
        }

        /* Custom Scrollbar for messages */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8;
            border-radius: 10px;

            messages: [
                { type: 'chat', text: "Hey... click the gear icon at the bottom right to upload your 5 chat screenshots and cat photos!", sender: 'me' }
            ]
        };

        // Exact response sequence requested for dodge attempts
        const NO_ATTEMPT_RESPONSES = [
            "Pleaseeee 🥺😢😭",
            "are you sure?!",
            "i will be sadd",
            "please nooo,",
            "please forgive meeeee duhh!!"
        ];

        let noDodgeCount = 0;
        let yesButtonScale = 1.0;

        // --- DOM ELEMENTS ---
        const page1 = document.getElementById('page-1');
        const page2 = document.getElementById('page-2');
        const page3 = document.getElementById('page-3');
        
        const messagesContainer = document.getElementById('messages-container');
        const page1Footer = document.getElementById('page-1-footer');
        const toPage2Btn = document.getElementById('to-page-2-btn');

        const sadCatImg = document.getElementById('sad-cat-img');
        const happyCatImg = document.getElementById('happy-cat-img');
        const responseFeedback = document.getElementById('response-feedback');
        
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        const openCustomizerBtn = document.getElementById('open-customizer-btn');
        const closeCustomizerBtn = document.getElementById('close-customizer-btn');
        const customizerModal = document.getElementById('customizer-modal');
        
        const screenshotFileInput = document.getElementById('screenshot-file-input');
        const screenshotThumbnails = document.getElementById('screenshot-thumbnails');
        const clearScreenshotsBtn = document.getElementById('clear-screenshots-btn');
        
        const sadCatFileInput = document.getElementById('sad-cat-file-input');
        const happyCatFileInput = document.getElementById('happy-cat-file-input');
        const sadCatThumb = document.getElementById('sad-cat-thumb');
        const happyCatThumb = document.getElementById('happy-cat-thumb');
        
        const savePreviewBtn = document.getElementById('save-preview-btn');
        const exportHtmlBtn = document.getElementById('export-html-btn');

        // --- BACKGROUND STAR PARTICLES ---
        function initSparkles() {
            const container = document.getElementById('sparkle-container');
            if (!container) return;
            container.innerHTML = '';
            const stars = ['✦', '•', '·', '✧', '✦'];
            for (let i = 0; i < 20; i++) {
                const el = document.createElement('div');
                el.className = 'bg-star';
                el.innerText = stars[Math.floor(Math.random() * stars.length)];
                el.style.left = Math.random() * 95 + 'vw';
                el.style.animationDuration = (8 + Math.random() * 10) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                el.style.fontSize = (12 + Math.random() * 14) + 'px';
                container.appendChild(el);
            }
        }

        // --- PAGE 1: SEQUENTIAL MESSAGE REVEAL ---
        function startMessageSequence() {
            messagesContainer.innerHTML = '';
            page1Footer.classList.add('hidden');
            
            let delay = 200;
            appData.messages.forEach((msg, idx) => {
                setTimeout(() => {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'animate-pop-in w-full flex justify-center';
                    
                    if (msg.type === 'image') {
                        msgEl.innerHTML = `
                            <div class="bg-purple-50/70 p-2 rounded-2xl border border-purple-100 shadow-sm w-full max-w-md flex justify-center">
                                <img src="${msg.src}" alt="Screenshot ${idx + 1}" class="w-full h-auto max-h-72 object-contain rounded-xl">
                            </div>
                        `;
                    } else {
                        msgEl.innerHTML = `
                            <div class="w-full flex justify-center">
                                <div class="bg-gradient-to-r from-purple-400 to-pink-400 text-white font-medium px-4 py-3 rounded-2xl shadow-md text-sm max-w-[90%] text-center">
                                    ${msg.text}
                                </div>
                            </div>
                        `;
                    }
                    messagesContainer.appendChild(msgEl);
                    
                    // Smooth autoscroll down as each image/message appears
                    messagesContainer.scrollTo({
                        top: messagesContainer.scrollHeight,
                        behavior: 'smooth'
                    });

                    // Show footer after last message and perform a final smooth scroll
                    if (idx === appData.messages.length - 1) {
                        setTimeout(() => {
                            page1Footer.classList.remove('hidden');
                            // Ensure the container smoothly scrolls down to reveal the last screenshot & footer
                            setTimeout(() => {
                                messagesContainer.scrollTo({
                                    top: messagesContainer.scrollHeight,
                                    behavior: 'smooth'
                                });
                            }, 100);
                        }, 400);
                    }
                }, delay);
                
                delay += 600; // Gap between each pop-in
            });
        }

        // --- PAGE 2: INTERACTIVE NO DODGE LOGIC ---
        function handleNoDodge() {
            noDodgeCount++;

            // 1. Update reaction text response
            const textIdx = Math.min(noDodgeCount - 1, NO_ATTEMPT_RESPONSES.length - 1);
            responseFeedback.innerText = NO_ATTEMPT_RESPONSES[textIdx];
            responseFeedback.classList.remove('animate-pop-in');
            void responseFeedback.offsetWidth; // trigger reflow
            responseFeedback.classList.add('animate-pop-in');

            // 2. Grow the YES button
            yesButtonScale += 0.14;
            yesBtn.style.transform = `scale(${yesButtonScale})`;

            // 3. Dodge NO button to a random offset within safe range
            const maxX = 120;
            const maxY = 60;
            const randomX = (Math.random() - 0.5) * maxX * 2;
            const randomY = (Math.random() - 0.5) * maxY * 2;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // --- IMAGE COMPRESSION UTIL (Canvas - Max 900px, 0.85 Quality) ---
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 900; // max width/height

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    callback(compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- CUSTOMIZER UI UPDATES ---
        function renderCustomizerUI() {
            if (!screenshotThumbnails) return;
            
            // Render screenshot thumbnails
            screenshotThumbnails.innerHTML = '';
            appData.messages.forEach((msg, idx) => {
                const div = document.createElement('div');
                div.className = 'relative aspect-square bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center p-1';
                
                if (msg.type === 'image') {
                    div.innerHTML = `<img src="${msg.src}" class="w-full h-full object-cover rounded-lg">`;
                } else {
                    div.innerHTML = `<span class="text-[10px] text-slate-500 font-medium line-clamp-3 p-1">${msg.text}</span>`;
                }
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'absolute top-1 right-1 bg-rose-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-rose-600';
                deleteBtn.innerHTML = '×';
                deleteBtn.onclick = () => {
                    appData.messages.splice(idx, 1);
                    renderCustomizerUI();
                };
                div.appendChild(deleteBtn);
                screenshotThumbnails.appendChild(div);
            });

            // Update Cat thumbnails
            if (sadCatThumb) sadCatThumb.src = appData.sadCatImg;
            if (happyCatThumb) happyCatThumb.src = appData.happyCatImg;
            if (sadCatImg) sadCatImg.src = appData.sadCatImg;
            if (happyCatImg) happyCatImg.src = appData.happyCatImg;
        }

        // --- EVENT LISTENERS ---
        
        // Navigation: Page 1 -> Page 2
        if (toPage2Btn) {
            toPage2Btn.addEventListener('click', () => {
                page1.classList.add('hidden');
                page2.classList.remove('hidden');
                page2.classList.add('animate-pop-in');
                sadCatImg.src = appData.sadCatImg;
                responseFeedback.innerText = '';
            });
        }

        // Interactive Buttons: Dodge on Hover & Click/Touch
        if (noBtn) {
            noBtn.addEventListener('mouseover', handleNoDodge);
            noBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleNoDodge();
            });
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleNoDodge();
            });
        }

        // Navigation: Page 2 -> Page 3 (YES Clicked)
        if (yesBtn) {
            yesBtn.addEventListener('click', () => {
                page2.classList.add('hidden');
                page2.classList.remove('flex');
                
                page3.classList.remove('hidden');
                page3.classList.add('flex');
                happyCatImg.src = appData.happyCatImg;

                // Trigger Confetti Burst
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }
            });
        }

        // Customizer Modal Open/Close
        if (openCustomizerBtn) {
            openCustomizerBtn.addEventListener('click', () => {
                renderCustomizerUI();
                customizerModal.classList.remove('hidden');
            });
        }
        if (closeCustomizerBtn) {
            closeCustomizerBtn.addEventListener('click', () => {
                customizerModal.classList.add('hidden');
            });
        }

        // File Inputs logic
        if (screenshotFileInput) {
            screenshotFileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                
                // If default text messages are present, clear them on first upload
                if (appData.messages.length > 0 && appData.messages[0].type === 'chat') {
                    appData.messages = [];
                }

                let loaded = 0;
                files.forEach(file => {
                    compressImage(file, (dataUrl) => {
                        appData.messages.push({ type: 'image', src: dataUrl });
                        loaded++;
                        if (loaded === files.length) {
                            renderCustomizerUI();
                        }
                    });
                });
            });
        }

        if (clearScreenshotsBtn) {
            clearScreenshotsBtn.addEventListener('click', () => {
                appData.messages = [];
                renderCustomizerUI();
            });
        }

        if (sadCatFileInput) {
            sadCatFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (dataUrl) => {
                        appData.sadCatImg = dataUrl;
                        renderCustomizerUI();
                    });
                }
            });
        }

        if (happyCatFileInput) {
            happyCatFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    compressImage(file, (dataUrl) => {
                        appData.happyCatImg = dataUrl;
                        renderCustomizerUI();
                    });
                }
            });
        }

        if (savePreviewBtn) {
            savePreviewBtn.addEventListener('click', () => {
                customizerModal.classList.add('hidden');
                sadCatImg.src = appData.sadCatImg;
                happyCatImg.src = appData.happyCatImg;
                
                // Reset to page 1 & restart sequence
                page2.classList.add('hidden');
                page3.classList.add('hidden');
                page1.classList.remove('hidden');
                startMessageSequence();
            });
        }

        // --- ROCK-SOLID STANDALONE EXPORTER (DIRECT INJECTION INTO BAKED SCRIPT) ---
        if (exportHtmlBtn) {
            exportHtmlBtn.addEventListener('click', () => {
                // 1. Clone document tree
                const cleanDoc = document.documentElement.cloneNode(true);

                // 2. Remove setup button and customizer modal from exported document
                const customizerBtnInClean = cleanDoc.querySelector('#open-customizer-btn');
                const customizerModalInClean = cleanDoc.querySelector('#customizer-modal');
                if (customizerBtnInClean) customizerBtnInClean.remove();
                if (customizerModalInClean) customizerModalInClean.remove();

                // 3. Reset page visibility so recipient ALWAYS starts on Page 1
                const cleanPage1 = cleanDoc.querySelector('#page-1');
                const cleanPage2 = cleanDoc.querySelector('#page-2');
                const cleanPage3 = cleanDoc.querySelector('#page-3');
                
                if (cleanPage1) cleanPage1.classList.remove('hidden');
                if (cleanPage2) {
                    cleanPage2.classList.add('hidden');
                    cleanPage2.classList.remove('flex');
                }
                if (cleanPage3) {
                    cleanPage3.classList.add('hidden');
                    cleanPage3.classList.remove('flex');
                }

                // 4. Reset Page 1 message container & footer for clean onload playback
                const cleanMessagesContainer = cleanDoc.querySelector('#messages-container');
                const cleanPage1Footer = cleanDoc.querySelector('#page-1-footer');
                if (cleanMessagesContainer) cleanMessagesContainer.innerHTML = '';
                if (cleanPage1Footer) cleanPage1Footer.classList.add('hidden');

                // 5. Reset Page 2 button dodging and scaling state
                const cleanYesBtn = cleanDoc.querySelector('#yes-btn');
                const cleanNoBtn = cleanDoc.querySelector('#no-btn');
                const cleanFeedback = cleanDoc.querySelector('#response-feedback');
                if (cleanYesBtn) cleanYesBtn.style.transform = '';
                if (cleanNoBtn) cleanNoBtn.style.transform = '';
                if (cleanFeedback) cleanFeedback.innerText = '';

                // 6. Directly set current appData into #baked-data script block inside cloned document
                const bakedScriptEl = cleanDoc.querySelector('#baked-data');
                if (bakedScriptEl) {
                    bakedScriptEl.textContent = 'window.BAKED_APP_DATA = ' + JSON.stringify(appData) + ';';
                }

                // 7. Create UTF-8 HTML Blob and trigger download
                const htmlString = '<!DOCTYPE html>\n' + cleanDoc.outerHTML;
                const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Blehhh.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // --- ON PAGE LOAD INIT ---
        window.onload = function() {
            initSparkles();
            if (sadCatImg) sadCatImg.src = appData.sadCatImg;
            if (happyCatImg) happyCatImg.src = appData.happyCatImg;
            startMessageSequence();
        };
    </script>
